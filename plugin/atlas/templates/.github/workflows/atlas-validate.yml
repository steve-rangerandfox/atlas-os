name: atlas-validate
# The evidence job. Every rung is required: a skipped rung is NEVER a pass.
# This is the required status check referenced by the branch ruleset.
on:
  pull_request:
  push:
    branches: ["{{DEFAULT_BRANCH}}"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read          # required to pull the certified image from GHCR

defaults:
  run:
    # Actions picks `sh -e {0}` inside a container when it cannot resolve bash,
    # and dash rejects `set -euo pipefail` with "Illegal option -o pipefail" —
    # failing every step that asks for strict mode. Declare it explicitly.
    # `shell: bash` runs `bash --noprofile --norc -eo pipefail {0}`, so pipefail
    # is set by the invocation and any `set -euo pipefail` in a step is redundant
    # but harmless. If a base image genuinely lacks bash this fails with
    # "command not found" — add bash to the Dockerfile and re-pin in that case.
    shell: bash

concurrency:
  group: atlas-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas-validate:
    name: atlas-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: {{DEV_IMAGE_DIGEST}}
      # GHCR packages land private by default, and a job container is pulled
      # before the job starts — without credentials the pull fails on auth,
      # producing a dead container and a misleading cascade of step failures.
      # Harmless if the package is public.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain matches the project pin
        run: |
          set -euo pipefail
          want="$(node -p 'const p=require("./package.json");(p.engines&&p.engines.node)||""')"
          [ -n "$want" ] || { echo "::error::No Node pin declared in package.json engines"; exit 1; }
          have="$(node -p 'process.versions.node')"
          echo "declared=$want actual=$have"
          # Major-version comparison in shell, with no helper dependency. An
          # earlier version installed a semver package globally and then
          # require()d it from `node -e`, which is not resolvable without
          # NODE_PATH — so the check failed on its own helper rather than on the
          # toolchain it exists to verify.
          want_major="${want%%.*}"
          for pfx in '>=' '^' '~' 'v'; do want_major="${want_major#$pfx}"; done
          have_major="${have%%.*}"
          [ "$have_major" = "$want_major" ] \
            || { echo "::error::Node $have does not satisfy $want (major $have_major != $want_major)"; exit 1; }
          echo "node pin satisfied"

      - name: Manifests unchanged by the working tree
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git diff --quiet -- package.json package-lock.json; then
            echo "::error::package.json or package-lock.json is modified. Manifest changes are a human decision."
            git diff --stat -- package.json package-lock.json
            exit 1
          fi

      - name: Restore dependencies
        run: |
          set -euo pipefail
          # Actions mounts the repo at /__w/<repo>/<repo>, not /workspace, so the
          # image's baked node_modules is NOT on the resolution path here. This is
          # a required step, not a soft fallback: a warning that degrades to
          # "carried on without dependencies" is the same defect class as counting
          # a skipped test as a pass.
          npm ci --ignore-scripts
          test -x node_modules/.bin/playwright \
            || { echo "::error::playwright binary missing after npm ci"; exit 1; }
          ./node_modules/.bin/playwright --version

{{LADDER_STEPS}}

      - name: Evidence record
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .atlas/evidence
          cat > .atlas/evidence/validation-${{ github.run_id }}.json <<JSON
          { "runner": "atlas_ci",
            "repository": "${{ github.repository }}",
            "gitHead": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "image": "{{DEV_IMAGE_DIGEST}}",
            "runId": "${{ github.run_id }}",
            "conclusion": "${{ job.status }}",
            "finishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)" }
          JSON
          cat .atlas/evidence/validation-${{ github.run_id }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-evidence-${{ github.run_id }}
          path: .atlas/evidence/
          retention-days: 30
